# Passway: plain HTTP on :80.
#
# Include this file inside the http block, for example from conf.d:
#
#     include /etc/nginx/passway/passway-http.conf;
#
# passway-server's plain listener (127.0.0.1:8081) does two jobs: it answers
# ACME HTTP-01 challenges and redirects everything else to HTTPS. The
# existing apps' :80 server blocks are not touched: nginx picks them by
# server_name before reaching these.
#
# Replace passway.example with the Passway domain.

map $http_upgrade $passway_connection {
    default upgrade;
    ''      close;
}

# The base domain and every tunnel subdomain.
server {
    listen 80;
    listen [::]:80;
    server_name passway.example *.passway.example;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $passway_connection;
    }
}

# Unknown hosts. Custom domains point a CNAME at edge.passway.example, and
# their certificates are issued on demand over HTTP-01, so challenges for
# hosts nginx has never heard of must reach Passway.
#
# If nginx already has a `default_server` on :80, don't add this block. Put
# the location below into that server instead, because two default servers on
# one port fail `nginx -t`. The other route is TLS-ALPN-01: it works through
# the :443 passthrough with no :80 change (see docs/deploy.md).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }

    location / {
        # Passway redirects to https://<host>/..., which it serves for verified
        # custom domains.
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }
}
