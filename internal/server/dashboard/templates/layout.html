{{define "head"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{.Title}} - Passway</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main{{if .Wide}} class="wide"{{end}}>
<header class="top">
<a class="brand" href="/"><svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#5b5bf0"/><path d="M6 21h6c3 0 3-10 6-10h8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="26" cy="11" r="2.4" fill="#fff"/></svg>Passway</a>
{{if .User}}<form class="signout" method="post" action="/logout"><input type="hidden" name="csrf" value="{{.CSRF}}"><span class="who">@{{.User.Login}}</span><button type="submit" class="link">Sign out</button></form>{{end}}
</header>
{{end}}
{{define "foot"}}
<footer>Passway &middot; <a href="https://passway.run">passway.run</a></footer>
</main>
</body>
</html>
{{end}}
