<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Passway Inspector</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%235b5bd6'/%3E%3Cpath d='M8 17V11a4 4 0 0 1 8 0v6' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #ffffff;
  --bg-side: #fbfbfc;
  --bg-sub: #f6f6f8;
  --bg-hover: #f2f2f5;
  --bg-sel: #efeffb;
  --bg-code: #fafafb;
  --border: #ececf0;
  --border-strong: #dcdce3;
  --fg: #17171c;
  --fg-muted: #5f5f6b;
  --fg-subtle: #9a9aa6;
  --accent: #5b5bd6;
  --accent-hover: #4d4dc7;
  --accent-fg: #ffffff;
  --accent-soft: rgba(91, 91, 214, .11);
  --ok: #18794e;     --ok-bg: rgba(24, 160, 88, .11);
  --redir: #0b68cb;  --redir-bg: rgba(11, 104, 203, .10);
  --warn: #ad5700;   --warn-bg: rgba(245, 158, 11, .15);
  --err: #ce2c31;    --err-bg: rgba(229, 72, 77, .11);
  --neutral-bg: rgba(120, 120, 135, .12);
  --syn-key: #4b47b8;
  --syn-str: #18794e;
  --syn-num: #b4500a;
  --syn-lit: #c03b78;
  --syn-punc: #8b8b96;
  --shadow-sm: 0 1px 2px rgba(16, 16, 24, .05);
  --shadow-lg: 0 10px 30px -8px rgba(16, 16, 24, .22), 0 2px 6px rgba(16, 16, 24, .06);
  --live: #22a55b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0d10;
    --bg-side: #111115;
    --bg-sub: #16161b;
    --bg-hover: #18181e;
    --bg-sel: #1c1c2c;
    --bg-code: #121216;
    --border: #212128;
    --border-strong: #2d2d36;
    --fg: #ececf1;
    --fg-muted: #a1a1ad;
    --fg-subtle: #686874;
    --accent: #7c7cf2;
    --accent-hover: #8e8ef6;
    --accent-fg: #0d0d10;
    --accent-soft: rgba(124, 124, 242, .16);
    --ok: #3dd68c;     --ok-bg: rgba(61, 214, 140, .12);
    --redir: #70b8ff;  --redir-bg: rgba(112, 184, 255, .12);
    --warn: #ffca16;   --warn-bg: rgba(255, 202, 22, .12);
    --err: #ff6369;    --err-bg: rgba(255, 99, 105, .13);
    --neutral-bg: rgba(160, 160, 175, .14);
    --syn-key: #a5a5ff;
    --syn-str: #5ed7a0;
    --syn-num: #ffa057;
    --syn-lit: #f17eb8;
    --syn-punc: #6e6e7a;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
    --shadow-lg: 0 12px 34px -8px rgba(0, 0, 0, .7), 0 0 0 1px rgba(255, 255, 255, .06);
    --live: #3dd68c;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0d10;
  --bg-side: #111115;
  --bg-sub: #16161b;
  --bg-hover: #18181e;
  --bg-sel: #1c1c2c;
  --bg-code: #121216;
  --border: #212128;
  --border-strong: #2d2d36;
  --fg: #ececf1;
  --fg-muted: #a1a1ad;
  --fg-subtle: #686874;
  --accent: #7c7cf2;
  --accent-hover: #8e8ef6;
  --accent-fg: #0d0d10;
  --accent-soft: rgba(124, 124, 242, .16);
  --ok: #3dd68c;     --ok-bg: rgba(61, 214, 140, .12);
  --redir: #70b8ff;  --redir-bg: rgba(112, 184, 255, .12);
  --warn: #ffca16;   --warn-bg: rgba(255, 202, 22, .12);
  --err: #ff6369;    --err-bg: rgba(255, 99, 105, .13);
  --neutral-bg: rgba(160, 160, 175, .14);
  --syn-key: #a5a5ff;
  --syn-str: #5ed7a0;
  --syn-num: #ffa057;
  --syn-lit: #f17eb8;
  --syn-punc: #6e6e7a;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow-lg: 0 12px 34px -8px rgba(0, 0, 0, .7), 0 0 0 1px rgba(255, 255, 255, .06);
  --live: #3dd68c;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  --sans: Inter, "Inter Variable", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", "SF Mono", ui-monospace, "Cascadia Code", Menlo, Consolas, "Liberation Mono", monospace;
  font: 13px/1.5 var(--sans);
  font-feature-settings: "cv11", "ss01";
  color: var(--fg);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
button, input, textarea, select { font: inherit; color: inherit; }
.mono { font-family: var(--mono); font-size: 12px; }
::selection { background: var(--accent-soft); }
* { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }

/* ---------- top bar ---------- */
header.top {
  height: 52px;
  flex: none;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 14px; letter-spacing: -.01em; white-space: nowrap; }
.brand .mark { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); display: grid; place-items: center; box-shadow: inset 0 -1px 0 rgba(0,0,0,.15); }
.brand .mark svg { width: 14px; height: 14px; }
.brand .sub { color: var(--fg-subtle); font-weight: 500; }
.sep { width: 1px; height: 20px; background: var(--border); flex: none; }
.tunnel {
  display: flex; align-items: center; gap: 8px; min-width: 0;
  height: 30px; padding: 0 6px 0 10px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg-sub);
}
.tunnel .url { font-family: var(--mono); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tunnel .url .scheme { color: var(--fg-subtle); }
.tunnel .arrow { color: var(--fg-subtle); flex: none; }
.tunnel .target { font-family: var(--mono); font-size: 12px; color: var(--fg-muted); white-space: nowrap; }
.tunnel.pending .url { color: var(--fg-subtle); font-family: var(--sans); font-size: 12.5px; }
.tunnel .lock { color: var(--ok); display: flex; flex: none; }
.spacer { flex: 1; }
.conn { display: flex; align-items: center; gap: 7px; color: var(--fg-muted); font-size: 12.5px; white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--fg-subtle); flex: none; position: relative; }
.conn.live .dot { background: var(--live); }
.conn.live .dot::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; background: var(--live); opacity: .35; animation: pulse 2s ease-out infinite; }
@keyframes pulse { 0% { transform: scale(.6); opacity: .45; } 100% { transform: scale(1.9); opacity: 0; } }

.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px;
  border: 1px solid var(--border-strong); border-radius: 7px; background: var(--bg);
  color: var(--fg); font-weight: 500; font-size: 12.5px; cursor: pointer; white-space: nowrap;
  box-shadow: var(--shadow-sm); transition: background .12s, border-color .12s, color .12s, transform .06s;
}
.btn:hover { background: var(--bg-hover); }
.btn:active { transform: translateY(.5px); }
.btn:focus-visible, .icon-btn:focus-visible, .tab:focus-visible, .row:focus-visible, .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-fg); }
.btn.primary:hover { background: var(--accent-hover); }
.btn.ghost { border-color: transparent; background: transparent; box-shadow: none; color: var(--fg-muted); }
.btn.ghost:hover { background: var(--bg-hover); color: var(--fg); }
.btn svg { width: 14px; height: 14px; flex: none; }
.btn kbd { margin-left: 2px; }
.btn:disabled { opacity: .5; cursor: default; }
.icon-btn { display: inline-grid; place-items: center; width: 26px; height: 26px; border: 0; border-radius: 6px; background: transparent; color: var(--fg-muted); cursor: pointer; flex: none; }
.icon-btn:hover { background: var(--bg-hover); color: var(--fg); }
.icon-btn svg { width: 14px; height: 14px; }
kbd {
  font-family: var(--sans); font-size: 10.5px; font-weight: 500; line-height: 1;
  min-width: 17px; height: 17px; padding: 0 4px; display: inline-grid; place-items: center;
  border-radius: 4px; border: 1px solid var(--border-strong); color: var(--fg-subtle); background: var(--bg);
}
.btn.primary kbd { border-color: rgba(255,255,255,.3); color: inherit; background: transparent; opacity: .8; }

/* ---------- layout ---------- */
main { flex: 1; min-height: 0; display: grid; grid-template-columns: clamp(380px, 36%, 540px) minmax(0, 1fr); }
main.empty { display: none; }
aside.side { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--border); background: var(--bg-side); }
.filter { flex: none; padding: 10px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
.search { flex: 1; position: relative; display: flex; align-items: center; }
.search svg { position: absolute; left: 9px; width: 14px; height: 14px; color: var(--fg-subtle); pointer-events: none; }
.search input {
  width: 100%; height: 30px; padding: 0 30px 0 30px; border-radius: 7px; border: 1px solid var(--border-strong);
  background: var(--bg); outline: none; font-size: 12.5px; transition: border-color .12s, box-shadow .12s;
}
.search input::placeholder { color: var(--fg-subtle); }
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search kbd { position: absolute; right: 7px; }
.count { color: var(--fg-subtle); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }

.list-head, .row { display: grid; grid-template-columns: 56px minmax(0, 1fr) 46px 58px 60px; align-items: center; column-gap: 8px; padding: 0 14px 0 16px; }
.list-head { flex: none; height: 28px; font-size: 11px; font-weight: 500; color: var(--fg-subtle); text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--border); }
.list-head .r, .row .r { text-align: right; }
.list { flex: 1; overflow-y: auto; overflow-x: hidden; outline: none; }
.row {
  position: relative; height: 38px; cursor: pointer; border-bottom: 1px solid var(--border);
  transition: background .1s; overflow: hidden;
}
.row:hover { background: var(--bg-hover); }
.row.sel { background: var(--bg-sel); }
.row.sel::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--accent); }
.row .m { font-family: var(--mono); font-size: 11.5px; font-weight: 600; color: var(--fg-muted); letter-spacing: .01em; }
.row.sel .m { color: var(--accent); }
.row .u { display: flex; align-items: center; gap: 6px; min-width: 0; }
.row .path { font-family: var(--mono); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.row .path .q { color: var(--fg-subtle); }
.row .d, .row .t { font-size: 12px; color: var(--fg-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.row .t { color: var(--fg-subtle); }
.row.enter { animation: rowIn .32s cubic-bezier(.2, .8, .2, 1); }
.row.enter::after { content: ""; position: absolute; inset: 0; background: var(--accent-soft); animation: flash 1.8s ease-out forwards; pointer-events: none; }
@keyframes rowIn { from { height: 0; opacity: 0; } to { height: 38px; opacity: 1; } }
@keyframes flash { from { opacity: 1; } to { opacity: 0; } }
.badge {
  flex: none; display: inline-flex; align-items: center; gap: 3px; height: 17px; padding: 0 5px; border-radius: 4px;
  font-size: 10.5px; font-weight: 500; color: var(--fg-muted); background: var(--neutral-bg); white-space: nowrap;
}
.badge svg { width: 10px; height: 10px; }
.badge.replay { color: var(--accent); background: var(--accent-soft); }
.no-match { padding: 40px 20px; text-align: center; color: var(--fg-subtle); }

.status { font-family: var(--mono); font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.s2 { color: var(--ok); } .s3 { color: var(--redir); } .s4 { color: var(--warn); } .s5 { color: var(--err); } .s0 { color: var(--fg-subtle); }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.s2 { background: var(--ok-bg); } .pill.s3 { background: var(--redir-bg); } .pill.s4 { background: var(--warn-bg); } .pill.s5 { background: var(--err-bg); } .pill.s0 { background: var(--neutral-bg); }
.side-foot { flex: none; display: flex; gap: 14px; padding: 8px 16px; border-top: 1px solid var(--border); color: var(--fg-subtle); font-size: 11.5px; }
.side-foot span { display: inline-flex; align-items: center; gap: 5px; }

/* ---------- detail ---------- */
section.detail { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--bg); }
.d-head { flex: none; padding: 18px 24px 0; }
.d-title { display: flex; align-items: flex-start; gap: 14px; }
.d-url { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 10px; }
.method-tag { flex: none; font-family: var(--mono); font-size: 12px; font-weight: 600; padding: 2px 7px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); }
.full-url { font-family: var(--mono); font-size: 13.5px; font-weight: 500; word-break: break-all; line-height: 1.45; }
.full-url .base { color: var(--fg-subtle); font-weight: 400; }
.actions { flex: none; display: flex; gap: 6px; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-top: 12px; color: var(--fg-muted); font-size: 12.5px; }
.meta .item { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.meta .item svg { width: 13px; height: 13px; color: var(--fg-subtle); }
.meta a { color: var(--accent); text-decoration: none; cursor: pointer; }
.meta a:hover { text-decoration: underline; }
.tabs { display: flex; gap: 2px; margin-top: 16px; border-bottom: 1px solid var(--border); }
.tab {
  position: relative; display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 10px; margin-bottom: -1px;
  border: 0; background: none; cursor: pointer; color: var(--fg-muted); font-weight: 500; border-bottom: 2px solid transparent;
  transition: color .12s, border-color .12s;
}
.tab:hover { color: var(--fg); }
.tab.on { color: var(--fg); border-bottom-color: var(--accent); }
.tab .n { font-size: 11px; color: var(--fg-subtle); font-weight: 500; }
.tab .sdot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.d-body { flex: 1; min-height: 0; overflow: auto; padding: 8px 24px 32px; }
.d-body.fade { animation: fadeIn .18s ease-out; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

.sec { margin-top: 14px; }
.sec-h { display: flex; align-items: center; gap: 8px; height: 30px; }
.sec-h .toggle {
  display: inline-flex; align-items: center; gap: 6px; border: 0; padding: 0; background: none; cursor: pointer;
  font-size: 12px; font-weight: 600; color: var(--fg); letter-spacing: .01em;
}
.sec-h .toggle svg { width: 12px; height: 12px; color: var(--fg-subtle); transition: transform .15s; }
.sec.closed .sec-h .toggle svg { transform: rotate(-90deg); }
.sec-h .n { color: var(--fg-subtle); font-weight: 500; font-size: 11.5px; }
.sec-h .tools { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.sec-h .kind { font-size: 11.5px; color: var(--fg-subtle); }
.sec.closed .sec-c { display: none; }
.sec-c { margin-top: 4px; }
.kv { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.kv-row { display: grid; grid-template-columns: minmax(150px, 26%) minmax(0, 1fr); border-bottom: 1px solid var(--border); }
.kv-row:last-child { border-bottom: 0; }
.kv-row > div { padding: 6px 12px; font-family: var(--mono); font-size: 12px; line-height: 1.55; word-break: break-all; }
.kv-row .k { color: var(--fg-muted); background: var(--bg-sub); border-right: 1px solid var(--border); }
.kv-row .v { white-space: pre-wrap; }
.kv-row:hover > div { background: var(--bg-hover); }
.code {
  margin: 0; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-code);
  font-family: var(--mono); font-size: 12px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere;
  tab-size: 2; max-height: none;
}
.j-k { color: var(--syn-key); } .j-s { color: var(--syn-str); } .j-n { color: var(--syn-num); } .j-l { color: var(--syn-lit); } .j-p { color: var(--syn-punc); }
.x-tag { color: var(--syn-key); } .x-attr { color: var(--syn-num); } .x-val { color: var(--syn-str); } .x-p { color: var(--syn-punc); } .x-c { color: var(--fg-subtle); font-style: italic; }
.placeholder-box {
  display: flex; align-items: center; gap: 8px; padding: 14px; border: 1px dashed var(--border-strong); border-radius: 8px;
  color: var(--fg-subtle); font-size: 12.5px;
}
.placeholder-box svg { width: 15px; height: 15px; }
.notice {
  display: flex; align-items: flex-start; gap: 8px; margin: 4px 0 8px; padding: 9px 12px; border-radius: 8px;
  background: var(--warn-bg); color: var(--warn); font-size: 12.5px; line-height: 1.45;
}
.notice svg { width: 15px; height: 15px; flex: none; margin-top: 1px; }
.notice.info { background: var(--accent-soft); color: var(--accent); }
.seg { display: inline-flex; padding: 2px; border-radius: 7px; background: var(--bg-sub); border: 1px solid var(--border); }
.seg button { border: 0; background: none; height: 20px; padding: 0 8px; border-radius: 5px; font-size: 11.5px; font-weight: 500; color: var(--fg-muted); cursor: pointer; }
.seg button.on { background: var(--bg); color: var(--fg); box-shadow: var(--shadow-sm); }

.pane-empty { flex: 1; display: grid; place-items: center; color: var(--fg-subtle); font-size: 13px; text-align: center; padding: 24px; }
.pane-empty svg { width: 28px; height: 28px; margin-bottom: 8px; opacity: .7; }

/* ---------- editor ---------- */
.editor { margin-top: 14px; display: flex; flex-direction: column; gap: 12px; }
.editor .line { display: flex; gap: 8px; }
.editor label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
.editor label .hint { font-weight: 400; color: var(--fg-subtle); margin-left: 6px; }
.field {
  width: 100%; border: 1px solid var(--border-strong); border-radius: 7px; background: var(--bg); outline: none;
  font-family: var(--mono); font-size: 12px; padding: 7px 10px; transition: border-color .12s, box-shadow .12s;
}
.field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
input.field { height: 32px; }
.editor .method { width: 110px; flex: none; text-transform: uppercase; font-weight: 600; }
textarea.field { resize: vertical; line-height: 1.6; min-height: 90px; }
textarea.field.body { min-height: 180px; }
.editor .foot { display: flex; align-items: center; gap: 8px; }
.editor .err { color: var(--err); font-size: 12.5px; flex: 1; }
.editor .foot .spacer { flex: 1; }

/* ---------- empty state ---------- */
.empty-state { flex: 1; display: none; place-items: center; padding: 24px 16px; overflow: auto; }
.empty-state.show { display: grid; }
.es-card { max-width: 560px; width: 100%; text-align: center; animation: fadeIn .4s ease-out; }
.radar { position: relative; width: 84px; height: 84px; margin: 0 auto 22px; display: grid; place-items: center; }
.radar .core { width: 44px; height: 44px; border-radius: 12px; background: var(--accent); display: grid; place-items: center; box-shadow: 0 6px 20px -4px var(--accent); position: relative; z-index: 1; }
.radar .core svg { width: 24px; height: 24px; }
.radar .ring { position: absolute; inset: 0; border-radius: 22px; border: 1.5px solid var(--accent); opacity: 0; animation: ring 2.8s cubic-bezier(.2, .6, .3, 1) infinite; }
.radar .ring:nth-child(2) { animation-delay: .93s; }
.radar .ring:nth-child(3) { animation-delay: 1.86s; }
@keyframes ring { 0% { transform: scale(.55); opacity: .55; } 100% { transform: scale(1.5); opacity: 0; } }
.es-card h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -.015em; }
.es-card p { margin: 8px 0 0; color: var(--fg-muted); font-size: 13.5px; }
.es-url { margin-top: 18px; display: inline-flex; align-items: center; gap: 8px; max-width: 100%; padding: 6px 6px 6px 12px; border: 1px solid var(--border); border-radius: 9px; background: var(--bg-sub); font-family: var(--mono); font-size: 12.5px; }
.es-url span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    case 'ArrowDown': case 'j': e.preventDefault(); move(1); break;
    case 'ArrowUp': case 'k': e.preventDefault(); move(-1); break;
    case '/': e.preventDefault(); filterEl.focus(); filterEl.select(); break;
    case 'r': replay(); break;
    case 'e': openEditor(); break;
    case 'c': copyCurl(); break;
    case 'Escape': if (S.editing) closeEditor(); break;
  }
});
$('#theme').addEventListener('click', () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  store.set('passway-theme', next);
  applyTheme(next);
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => applyTheme(document.documentElement.dataset.theme));
setInterval(() => { for (const n of document.querySelectorAll('[data-ts]')) n.textContent = rel(n.dataset.ts); }, 5000);

const qTheme = new URLSearchParams(location.search).get('theme');
applyTheme(qTheme === 'dark' || qTheme === 'light' ? qTheme : store.get('passway-theme'));
setLive(false);
renderStatus();
renderList();
renderDetail();
const initial = routeId();
if (initial) select(initial.id, initial);
pollStatus();
loadList();
connect();
</script>
</body>
</html>
