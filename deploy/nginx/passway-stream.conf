# Passway: TLS passthrough on :443, routed by SNI.
#
# Include this file at the top level of nginx.conf, outside the http block:
#
#     include /etc/nginx/passway/passway-stream.conf;
#
# It needs the stream and stream_ssl_preread modules. They are built into
# the nginx.org packages; on Debian/Ubuntu install libnginx-mod-stream.
#
# nginx stops listening on :443 in its http block. Each existing app's
# server block moves to 127.0.0.1:8443 and accepts the PROXY header there
# (see existing-app.example.conf). Everything else goes to passway-server on
# 127.0.0.1:9443: the base domain, *.<domain>, custom domains and any unknown
# or missing SNI. passway-server terminates its own TLS.
#
# Replace the example hostnames with the hostnames your existing apps serve.

stream {
    map $ssl_preread_server_name $passway_upstream {
        hostnames;

        # The owner's existing apps: nginx's own http block.
        app.example.com      127.0.0.1:8443;
        www.app.example.com  127.0.0.1:8443;
        blog.example.com     127.0.0.1:8443;

        # Everything else: Passway.
        default              127.0.0.1:9443;
    }

    server {
        listen 443;
        listen [::]:443;

        ssl_preread on;
        proxy_pass $passway_upstream;

        # Every connection gets a PROXY protocol header carrying the real client
        # address. proxy_protocol is set per server block and can't follow the
        # map, so it applies to both upstreams:
        #   - passway-server reads it with --proxy-protocol.
        #   - The apps' 127.0.0.1:8443 listeners read it with
        #     `listen ... proxy_protocol` plus
        #     `set_real_ip_from 127.0.0.1; real_ip_header proxy_protocol;`.
        #     This keeps their logs and rate limits on real client IPs. Without
        #     those lines, the apps reject every connection.
        # nginx sends PROXY v1 (text). passway-server accepts v1 and v2.
        proxy_protocol on;

        proxy_connect_timeout 10s;
        # Tunnel clients hold one long-lived WebSocket. They ping well inside
        # this limit, but don't cut idle tunnels at nginx's 10 minute default.
        proxy_timeout 1h;
    }
}
