# The change to make in EACH existing app's HTTPS server block.
#
# This file is all comments, so including it by accident does nothing. Copy
# the pattern into each app's own config and leave everything else in it
# unchanged.
#
# Before:
#
#     server {
#         listen 443 ssl;
#         listen [::]:443 ssl;
#         http2 on;
#         server_name app.example.com;
#         ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
#         ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
#         ...
#     }
#
# After:
#
#     server {
#         # :443 now belongs to the stream block (passway-stream.conf), which
#         # sends this app's traffic here with a PROXY header in front.
#         listen 127.0.0.1:8443 ssl proxy_protocol;
#         http2 on;
#         server_name app.example.com;
#         ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
#         ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
#
#         # Take the client address from the PROXY header, but only when the
#         # connection comes from the local stream proxy.
#         set_real_ip_from 127.0.0.1;
#         real_ip_header proxy_protocol;
#         ...
#     }
#
# Notes:
# - Remove the [::]:443 listen as well. IPv6 clients reach the stream block on
#   [::]:443, and their real address arrives in the PROXY header.
# - Every server block on 127.0.0.1:8443 must carry proxy_protocol. A server
#   block without it would choke on the header.
# - $remote_addr in access logs, `allow`/`deny` and limit_req keep seeing the
#   real client IP. To log both addresses, use $proxy_protocol_addr and
#   $realip_remote_addr.
# - Add each app's hostname to the map in passway-stream.conf. A hostname
#   missing there goes to Passway, which refuses the TLS handshake for a
#   name it doesn't serve, so the app breaks.
# - The apps' :80 server blocks stay exactly as they are.
